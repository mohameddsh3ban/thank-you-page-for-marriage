<!-- #08 — an infinite canvas of every photo: scroll drifts it, drag wanders it, "dive in" fills the screen -->
<section id="gallery" class="gallery" aria-labelledby="gallery-heading">
  <div class="gallery-pin">
    <div class="gallery-stage" id="gallery-stage"></div>

    <header class="gallery-head"><p class="eyebrow">#08 — All of us</p></header>

    <div class="gallery-title">
      <h2 id="gallery-heading"><span class="script">u</span>s</h2>
      <p id="gallery-count"></p>
    </div>

    <div class="gallery-invite">
      <button class="gallery-dive" id="gallery-dive" type="button" aria-label="Dive into the photos">
        <span class="gd-ripple" aria-hidden="true"></span>
        <span class="gd-script">dive</span>
        <span class="gd-label">in</span>
      </button>
      <p class="gallery-hint">or keep scrolling · drag to wander</p>
    </div>

    <p class="gallery-dive-hint">drag · wheel · arrow keys to wander<span>esc to come back up</span></p>
    <button class="gallery-surface" id="gallery-surface" type="button">come back up</button>
  </div>
</section>
