<section id="love" class="love" aria-labelledby="love-title">
  <header class="love-head">
    <p class="eyebrow">#09 — Every love message</p>
    <h2 class="love-title" id="love-title">Love <span class="script">in writing</span></h2>
    <p class="eyebrow love-meta" id="love-meta">every time we wrote it down</p>
  </header>

  <div class="love-river" id="love-river" aria-hidden="true"></div>

  <button class="love-open" id="love-open" type="button" aria-haspopup="dialog" aria-controls="love-book">
    <svg class="gift" viewBox="0 0 300 340" role="img" aria-label="a wrapped gift box" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gift-light" cx="50%" cy="60%" r="50%">
          <stop offset="0" stop-color="#fff4d6" stop-opacity="1" />
          <stop offset="0.45" stop-color="#ffc9d2" stop-opacity="0.65" />
          <stop offset="1" stop-color="#ff8fa3" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gift-paper" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d92a3e" />
          <stop offset="1" stop-color="#8c1426" />
        </linearGradient>
        <linearGradient id="gift-paper-lid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e5394c" />
          <stop offset="1" stop-color="#b01d31" />
        </linearGradient>
        <linearGradient id="gift-ribbon" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#c99a3c" />
          <stop offset="0.5" stop-color="#f3d58e" />
          <stop offset="1" stop-color="#c99a3c" />
        </linearGradient>
      </defs>

      <ellipse class="gift-shadow" cx="150" cy="318" rx="118" ry="13" />
      <ellipse class="gift-glow" cx="150" cy="128" rx="140" ry="96" fill="url(#gift-light)" />

      <g class="gift-base">
        <rect x="48" y="134" width="204" height="176" rx="4" fill="url(#gift-paper)" />
        <path d="M48 134h204v14H48z" fill="#000" fill-opacity="0.18" />
        <g fill="#fbe3e7" fill-opacity="0.22">
          <path d="M78 180c-4-6-13-3-11 4 2 6 11 11 11 11s9-5 11-11c2-7-7-10-11-4z" />
          <path d="M214 228c-4-6-13-3-11 4 2 6 11 11 11 11s9-5 11-11c2-7-7-10-11-4z" />
          <path d="M92 266c-3-5-10-2-9 3 2 5 9 9 9 9s7-4 9-9c1-5-6-8-9-3z" />
          <path d="M222 166c-3-5-10-2-9 3 2 5 9 9 9 9s7-4 9-9c1-5-6-8-9-3z" />
        </g>
        <rect x="136" y="134" width="28" height="176" fill="url(#gift-ribbon)" />
        <path d="M136 134h28v176h-28z" fill="none" stroke="#8a6420" stroke-opacity="0.35" />
      </g>

      <g class="gift-lid">
        <rect x="38" y="98" width="224" height="38" rx="4" fill="url(#gift-paper-lid)" />
        <rect x="134" y="98" width="32" height="38" fill="url(#gift-ribbon)" />
        <path d="M150 96c-22-34-70-44-74-18-3 20 40 24 74 18z" fill="url(#gift-ribbon)" stroke="#8a6420" stroke-opacity="0.4" />
        <path d="M150 96c22-34 70-44 74-18 3 20-40 24-74 18z" fill="url(#gift-ribbon)" stroke="#8a6420" stroke-opacity="0.4" />
        <path d="M148 98c-12 10-24 26-28 40M152 98c12 10 24 26 28 40" stroke="#c99a3c" stroke-width="7" stroke-linecap="round" fill="none" />
        <circle cx="150" cy="96" r="11" fill="#e2b75f" stroke="#8a6420" stroke-opacity="0.45" />
        <g class="gift-tag">
          <path d="M226 116l14 40" stroke="#c99a3c" stroke-width="1.5" />
          <g transform="rotate(-10 236 176)">
            <path d="M206 158h52v40h-52l-10-20z" fill="#fbf4e8" stroke="#c99a3c" stroke-opacity="0.6" />
            <circle cx="206" cy="178" r="2.5" fill="#c99a3c" />
            <text x="230" y="184" text-anchor="middle">for <tspan data-her-name>Mia</tspan></text>
          </g>
        </g>
      </g>
    </svg>
    <span class="gift-cta">
      <span class="script">open it</span>
      <span class="eyebrow">every love message inside ✦</span>
    </span>
  </button>
</section>
