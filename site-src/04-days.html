<section id="days" class="days" aria-labelledby="days-title">
  <header class="days-head">
    <p class="eyebrow">#04 — A ledger of us</p>
    <h2 class="days-title" id="days-title">A ledger <span class="script">of us</span></h2>
    <p class="days-sub" id="days-sub" aria-live="polite">one dot for every day we talked · the bigger the dot the louder the day</p>
    <dl class="days-facts" id="days-facts"></dl>
    <p class="eyebrow days-marked-title">our days · hover to find them, click to open</p>
    <ul class="marked-days" id="marked-days"></ul>
  </header>

  <article class="day-page" id="day-page" hidden tabindex="-1" aria-labelledby="dp-date"></article>

  <div class="ledger" id="ledger" data-lens="loud">
    <div class="ledger-top">
      <p class="ledger-date" id="ledger-date">14 Sept 2019</p>
      <p class="ledger-total"><b id="ledger-total">0</b> messages</p>
    </div>
    <div class="ledger-years" id="days-years"></div>
  </div>

  <aside class="day-note" id="day-note" hidden aria-hidden="true">
    <img class="dn-photo" id="dn-photo" alt="" hidden decoding="async">
    <p class="dn-date" id="dn-date"></p>
    <p class="dn-count" id="dn-count"></p>
    <p class="dn-title" id="dn-title"></p>
    <p class="dn-meta" id="dn-meta"></p>
    <p class="dn-hint">click to open the day</p>
  </aside>
</section>
