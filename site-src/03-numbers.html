<section id="numbers" class="numbers" aria-label="Us, in numbers">
  <div class="num-pin">
    <div class="num-sky" aria-hidden="true"></div>
    <div class="num-night" aria-hidden="true"></div>
    <canvas class="num-canvas" id="num-canvas" aria-hidden="true"></canvas>

    <header class="numbers-head">
      <p class="eyebrow">#03 — Us, in numbers</p>
      <h2 class="numbers-title">Us, <span class="script">counted</span></h2>
      <p class="numbers-sub">seven years of messages, one star for every hundred</p>
    </header>

    <ol class="num-scenes" id="num-scenes"></ol>

    <p class="num-legend" id="num-legend" aria-hidden="true"></p>

    <div class="num-call" id="num-call" aria-hidden="true">
      <img class="num-call-avatar" src="/photos/mm-19.t.webp" alt="">
      <b><span data-her-name>Mia</span> ♥</b>
      <span class="num-call-timer" id="num-call-timer">0:00:00</span>
    </div>

    <div class="num-progress" aria-hidden="true">
      <span id="num-now">01</span>
      <span class="np-line"><i id="num-bar"></i></span>
      <span id="num-all">08</span>
    </div>
  </div>
</section>
